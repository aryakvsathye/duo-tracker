name: Duo stock check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python check.py
        env:
          PART: ${{ secrets.PART }}
          ZIP: ${{ secrets.ZIP }}
