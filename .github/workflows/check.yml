name: Duo stock check
on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a fake in-stock alert"
        type: boolean
        default: false
      part:
        description: "Try a different part number (real check, nothing saved)"
        type: string
        default: ""
concurrency:
  group: duo-check
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The bot's code lives on main
      - uses: actions/checkout@v4
        with:
          ref: main
      # The bot's data (state.json, restocks.csv) lives on its own branch,
      # so code changes and data saves never touch the same files
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 0
      - run: pip install requests
      - run: python check.py
        env:
          PART: ${{ secrets.PART }}
          ZIP: ${{ secrets.ZIP }}
          TEST: ${{ inputs.test }}
          TRY_PART: ${{ inputs.part }}
          DATA_DIR: data
      - name: Save data
        if: ${{ !inputs.test && !inputs.part }}
        working-directory: data
        run: |
          git config user.name "duo-bot"
          git config user.email "duo-bot@users.noreply.github.com"
          git add state.json restocks.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update stock data"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data || git rebase --abort
            sleep 5
          done
          exit 1
