<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo Pit Wall</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pit Wall">
<meta name="theme-color" content="#0a0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-2: #181c25;
    --line: #232937;
    --text: #e8ecf3;
    --muted: #7d8699;
    --green: #22e07a;
    --red: #ff3b4e;
    --amber: #ffb020;
    --grey: #4a5266;
    --accent: #ff3b4e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
 
  header { display: flex; align-items: flex-end; justify-content: space-between; margin: 8px 0 18px; }
  .brand { font-weight: 800; font-size: 22px; letter-spacing: 0.04em; }
  .brand span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); letter-spacing: 0.12em; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s infinite; }
  .live.stale i { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .live.down i { background: var(--red); box-shadow: 0 0 10px var(--red); }
  @keyframes pulse { 50% { opacity: 0.3; } }
 
  .label { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin: 22px 0 10px; }
 
  .stores { display: grid; gap: 10px; }
  .store {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 12px;
    position: relative;
    overflow: hidden;
  }
  .store::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--grey); }
  .store.available::before { background: var(--green); box-shadow: 0 0 24px var(--green); }
  .store.unavailable::before { background: var(--red); }
  .store .name { font-weight: 600; font-size: 17px; }
  .store .meta { color: var(--muted); font-size: 12px; grid-column: 1; }
  .lights { display: flex; gap: 5px; grid-row: 1 / span 2; grid-column: 2; }
  .lights b { width: 14px; height: 14px; border-radius: 50%; background: #2a0d12; }
  .available .lights b { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .unavailable .lights b { background: var(--red); box-shadow: 0 0 8px rgba(255,59,78,0.6); }
  .unknown .lights b { background: var(--grey); }
  .store .state { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; grid-column: 1; }
  .available .state { color: var(--green); }
  .unavailable .state { color: var(--red); }
  .unknown .state { color: var(--muted); }
 
  .bag {
    display: block; text-align: center; margin-top: 12px;
    padding: 15px; border-radius: 14px; font-weight: 800; letter-spacing: 0.06em;
    text-decoration: none; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
  }
  .bag.go { color: #04120a; background: var(--green); border-color: var(--green); box-shadow: 0 0 30px rgba(34,224,122,0.4); }
 
  .telemetry { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .k { font-size: 10px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
  .tile .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .tile .v.small { font-size: 15px; }
  .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
 
  .heat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: hidden; }
  .grid { display: grid; grid-template-columns: 28px repeat(24, 1fr); gap: 2px; }
  .grid .d { font-size: 9px; color: var(--muted); display: flex; align-items: center; }
  .grid .c { aspect-ratio: 1; border-radius: 2px; background: var(--panel-2); }
  .hours { display: grid; grid-template-columns: 28px repeat(24, 1fr); gap: 2px; margin-top: 4px; font-size: 8px; color: var(--muted); }
  .heat-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
 
  .timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .ev { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .ev:last-child { border-bottom: none; }
  .ev i { width: 8px; height: 8px; border-radius: 50%; }
  .ev .t { color: var(--muted); font-size: 11px; }
  .empty { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }
 
  .err { background: #2a0d12; border: 1px solid var(--red); color: #ffb3bb; padding: 12px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
 
<header>
  <div>
    <div class="brand">DUO <span>PIT WALL</span></div>
    <div class="sub">iPhone Duo · 256GB · Night Sky</div>
  </div>
  <div class="live mono" id="live"><i></i><span id="liveText">CONNECTING</span></div>
</header>
 
<div class="err" id="err"></div>
 
<div class="label">Grid · stores within 50 mi</div>
<div class="stores" id="stores"><div class="empty">Loading…</div></div>
<a class="bag" id="bag" href="https://www.apple.com/shop/bag">NO STOCK · OPEN BAG</a>
 
<div class="label">Telemetry</div>
<div class="telemetry">
  <div class="tile"><div class="k">Last check</div><div class="v mono" id="lastCheck">–</div></div>
  <div class="tile"><div class="k">Session</div><div class="v small" id="mode">–</div></div>
  <div class="tile"><div class="k">Checks since 8am ping</div><div class="v mono" id="checks">–</div></div>
  <div class="tile"><div class="k">Errors</div><div class="v mono" id="errors">–</div></div>
</div>
 
<div class="label">Restock heatmap · when stock appears</div>
<div class="heat">
  <div class="grid" id="heat"></div>
  <div class="hours mono" id="hours"></div>
  <div class="heat-note" id="heatNote"></div>
</div>
 
<div class="label">Race log</div>
<div class="timeline" id="timeline"><div class="empty">Loading…</div></div>
 
<footer class="mono">Refreshes every 2 min · <span id="fetched">–</span></footer>
 
<script>
const OWNER = "aryakvsathye";
const REPO = "duo-tracker";
const BRANCH = "main";
const MAX_MILES = 50;
const REFRESH_MS = 120000;
 
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
let lastCheckAt = null;
let fetchedAt = null;
 
async function getFile(path) {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;
  const res = await fetch(url, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.text();
}
 
function parseCsv(text) {
  if (!text) return [];
  return text.trim().split("\n").slice(1).filter(Boolean).map(line => {
    const [time, store, miles, status] = line.split(",");
    return { time, store, miles: parseFloat(miles), status };
  });
}
 
function rel(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  if (h < 48) return `${h}h ago`;
  return `${Math.round(h / 24)}d ago`;
}
 
function nightNow() {
  const h = Number(new Intl.DateTimeFormat("en-US", { hour: "numeric", hour12: false, timeZone: "America/Chicago" }).format(new Date()));
  return h >= 22 || h < 7;
}
 
function renderStores(state, events) {
  const nearby = state.nearby || {};
  const names = Object.keys(nearby).sort((a, b) => nearby[a].miles - nearby[b].miles);
  const el = document.getElementById("stores");
  if (!names.length) { el.innerHTML = '<div class="empty">Waiting for the first check with the new script…</div>'; return; }
 
  let anyGreen = false;
  el.innerHTML = names.map(name => {
    const s = nearby[name];
    const cls = s.status === "available" ? "available" : s.status === "unavailable" ? "unavailable" : "unknown";
    if (cls === "available") anyGreen = true;
    const last = [...events].reverse().find(e => e.store === name);
    const since = last ? `since ${last.time.slice(5)}` : "no changes logged yet";
    const word = cls === "available" ? "IN STOCK" : cls === "unavailable" ? "NO STOCK" : "UNKNOWN";
    return `<div class="store ${cls}">
      <div class="name">${name}</div>
      <div class="lights"><b></b><b></b><b></b></div>
      <div class="state mono">${word}</div>
      <div class="meta">${s.miles.toFixed(1)} mi · ${since}</div>
    </div>`;
  }).join("");
 
  const bag = document.getElementById("bag");
  bag.classList.toggle("go", anyGreen);
  bag.textContent = anyGreen ? "LIGHTS OUT · OPEN BAG NOW" : "NO STOCK · OPEN BAG";
}
 
function renderTelemetry(state) {
  lastCheckAt = state.last_check ? new Date(state.last_check) : null;
  document.getElementById("checks").textContent = state.checks ?? "–";
  const errs = document.getElementById("errors");
  errs.textContent = state.errors ?? "–";
  errs.className = "v mono " + ((state.errors || 0) > 0 ? "warn" : "ok");
  const mode = document.getElementById("mode");
  mode.textContent = nightNow() ? "🌙 Night · every 15m" : "☀️ Day · every 1m";
  tick();
}
 
function renderHeat(events) {
  const counts = Array.from({ length: 7 }, () => Array(24).fill(0));
  const restocks = events.filter(e => e.status === "available" && e.miles <= MAX_MILES);
  restocks.forEach(e => {
    const [d, t] = e.time.split(" ");
    const [y, m, day] = d.split("-").map(Number);
    const dow = new Date(y, m - 1, day).getDay();
    const hr = Number(t.split(":")[0]);
    counts[dow][hr]++;
  });
  const max = Math.max(1, ...counts.flat());
  const order = [1, 2, 3, 4, 5, 6, 0];
  let html = "";
  order.forEach(dow => {
    html += `<div class="d mono">${DAYS[dow]}</div>`;
    for (let h = 0; h < 24; h++) {
      const v = counts[dow][h];
      const style = v ? `background: rgba(34,224,122,${0.25 + 0.75 * v / max}); box-shadow: 0 0 6px rgba(34,224,122,${0.5 * v / max});` : "";
      html += `<div class="c" style="${style}" title="${DAYS[dow]} ${h}:00 · ${v}"></div>`;
    }
  });
  document.getElementById("heat").innerHTML = html;
  document.getElementById("hours").innerHTML = "<span></span>" +
    Array.from({ length: 24 }, (_, h) => `<span>${h % 6 === 0 ? h : ""}</span>`).join("");
 
  const note = document.getElementById("heatNote");
  if (!restocks.length) {
    note.textContent = "No nearby restocks logged yet. Patterns show up here after the first few.";
  } else {
    let best = [0, 0, 0];
    order.forEach(dow => counts[dow].forEach((v, h) => { if (v > best[0]) best = [v, dow, h]; }));
    note.textContent = `${restocks.length} nearby restock${restocks.length > 1 ? "s" : ""} logged · hottest slot: ${DAYS[best[1]]} ${best[2]}:00–${best[2] + 1}:00`;
  }
}
 
function renderTimeline(events) {
  const el = document.getElementById("timeline");
  const recent = events.filter(e => e.miles <= MAX_MILES).slice(-20).reverse();
  if (!recent.length) { el.innerHTML = '<div class="empty">No stock changes at nearby stores yet.</div>'; return; }
  el.innerHTML = recent.map(e => {
    const color = e.status === "available" ? "var(--green)" : e.status === "unavailable" ? "var(--red)" : "var(--grey)";
    const word = e.status === "available" ? "In stock" : e.status === "unavailable" ? "Sold out" : e.status;
    return `<div class="ev"><i style="background:${color}; box-shadow: 0 0 8px ${color}"></i>
      <div><b>${word}</b> · ${e.store}</div><div class="t mono">${e.time.slice(5)}</div></div>`;
  }).join("");
}
 
function tick() {
  const live = document.getElementById("live");
  const liveText = document.getElementById("liveText");
  const lc = document.getElementById("lastCheck");
  if (!lastCheckAt) { lc.textContent = "–"; liveText.textContent = "NO DATA"; live.className = "live mono down"; return; }
  const age = Date.now() - lastCheckAt.getTime();
  lc.textContent = rel(age);
  const limit = (nightNow() ? 35 : 25) * 60000;
  if (age < limit) { live.className = "live mono"; liveText.textContent = "LIVE"; lc.className = "v mono ok"; }
  else if (age < limit * 3) { live.className = "live mono stale"; liveText.textContent = "DELAYED"; lc.className = "v mono warn"; }
  else { live.className = "live mono down"; liveText.textContent = "STALLED"; lc.className = "v mono bad"; }
  if (fetchedAt) document.getElementById("fetched").textContent = "updated " + rel(Date.now() - fetchedAt);
}
 
async function load() {
  const err = document.getElementById("err");
  try {
    const [stateText, csvText] = await Promise.all([getFile("state.json"), getFile("restocks.csv")]);
    const state = stateText ? JSON.parse(stateText) : {};
    const events = parseCsv(csvText);
    renderStores(state, events);
    renderTelemetry(state);
    renderHeat(events);
    renderTimeline(events);
    fetchedAt = Date.now();
    err.style.display = "none";
  } catch (e) {
    err.textContent = "Couldn't reach GitHub: " + e.message + ". Retrying in 2 minutes.";
    err.style.display = "block";
  }
  tick();
}
 
load();
setInterval(load, REFRESH_MS);
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
